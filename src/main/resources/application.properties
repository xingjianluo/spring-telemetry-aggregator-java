server.port=0

# 遥测聚合参数（前缀 telemetry，缺省值如下）
# 窗口长度（毫秒）
telemetry.window-millis=10000
# 可接受最大迟到时间（毫秒）
telemetry.allowed-lateness-millis=30000
# 单窗口不同 key=value 维度数上限
telemetry.max-dimensions-per-window=100
# 单窗口记录条数上限
telemetry.max-records-per-window=10000
# 内存保留窗口数上限（淘汰最旧）
telemetry.max-windows-retained=100
# 拒绝/兜底事件留痕上限
telemetry.max-rejected-events=1000
